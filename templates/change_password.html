<!DOCTYPE html>
<html lang="{{ session.get('lang', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - {{ t('app_title') }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 { font-size: 24px; }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header .user-info span { opacity: 0.9; font-size: 14px; }
        .header .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .header .logout-btn:hover { background: rgba(255,255,255,0.3); }
        .nav {
            background: white;
            padding: 12px 40px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .nav a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 5px 0;
            border-bottom: 3px solid transparent;
            transition: border-color 0.3s;
        }
        .nav a:hover, .nav a.active {
            border-bottom-color: #1565c0;
            color: #0d47a1;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .section h2 {
            color: #0d47a1;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            text-align: center;
        }
        .form-group { margin: 18px 0; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #1565c0; outline: none; }
        .btn {
            padding: 12px 30px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        .btn:hover { background: #0d47a1; }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #2e7d32;
            margin-bottom: 15px;
        }
        .error {
            background: #ffebee;
            color: #d32f2f;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #d32f2f;
            margin-bottom: 15px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #1565c0;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .language-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        .language-switcher a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
            padding: 2px 10px;
        }
        .language-switcher a.active {
            background: #1565c0;
            color: white;
            border-radius: 12px;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        @media (max-width: 600px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 10px; text-align: center; }
            .nav { padding: 10px 20px; justify-content: center; }
            .container { margin: 20px auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Change Password</h1>
        <div class="user-info">
            <span>Welcome, {{ session.username }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>
    
    <div class="nav">
        <a href="/student/dashboard">Dashboard</a>
        <a href="/student/transcript">My Transcript</a>
        <a href="/student/change_password" class="active">Change Password</a>
    </div>
    
    <div class="container">
        <div class="language-switcher">
            <span>Language:</span>
            <a href="/set_language/en" class="{% if session.lang == 'en' %}active{% endif %}">English</a>
            <a href="/set_language/fr" class="{% if session.lang == 'fr' %}active{% endif %}">Francais</a>
        </div>
        
        <div class="section">
            <h2>Change Your Password</h2>
            
            {% if success %}
            <div class="success">{{ success }}</div>
            {% endif %}
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" name="current_password" placeholder="Enter your current password" required>
                </div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" placeholder="Enter your new password" required>
                    <div class="hint">Password must be at least 6 characters</div>
                </div>
                
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm your new password" required>
                </div>
                
                <button type="submit" class="btn">Change Password</button>
            </form>
            
            <a href="/student/dashboard" class="back-link">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
